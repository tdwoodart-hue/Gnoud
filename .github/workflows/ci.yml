name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Regression tests
        run: node --import tsx --test test/mobile-modal-layering.test.ts test/report-service.test.ts test/exercise-service.test.ts test/reader-service.test.ts

      - name: Build
        run: npm run build
