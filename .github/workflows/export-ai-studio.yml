name: Export AI Studio ZIP

on:
  push:
    branches:
      - export/ai-studio-v0.9.8

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare clean project folder
        shell: bash
        run: |
          mkdir -p export
          rsync -a ./ export/Gnoud/ \
            --exclude '.git/' \
            --exclude '.github/workflows/export-ai-studio.yml' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'export/'

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gnoud-v0.9.8-AI-Studio
          path: export/Gnoud
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
